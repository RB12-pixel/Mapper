name: Build APK
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with: 
        java-version: '17'
        distribution: 'temurin'
    - run: chmod +x ./gradlew
    - run: ./gradlew assembleRelease
    - uses: softprops/action-gh-release@v1
      with: 
        files: app/build/outputs/apk/release/*.apk
