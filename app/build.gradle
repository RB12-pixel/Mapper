plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.benzinaio.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.benzinaio.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    implementation 'com.google.android.material:material:1.11.0' // per il popup
    implementation 'com.squareup.retrofit2:retrofit:2.9.0' // per i prezzi benzina
}
